name: A3-02 Rust 3MF external reader evidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/export/**'
      - 'crates/engine/**'
      - 'Cargo.toml'
      - '.github/workflows/a3-02-3mf-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-3mf:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned third-party independent 3MF parser
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'trimesh==4.11.1' 'numpy==2.3.5' 'lxml==6.1.1' 'networkx==3.6.1'
      - name: Generate actual signed Rust 3MF and SHA evidence
        shell: bash
        run: cargo run -p map2model-export --example synthetic_3mf -- ./synthetic-terrain.3mf | tee rust-export-report.txt
      - name: Independently validate OPC, mesh and canonical hash using Python stdlib
        shell: bash
        run: python crates/export/tests/independent_3mf.py ./synthetic-terrain.3mf crates/engine/fixtures/A3-01.reference.json | tee independent-opc-report.json
      - name: Open Rust-generated 3MF with third-party trimesh reader
        shell: bash
        run: python crates/export/tests/trimesh_import_3mf.py ./synthetic-terrain.3mf crates/engine/fixtures/A3-01.reference.json | tee trimesh-import-report.json
      - name: Validate model XML against published 3MF Core 1.4 Consortium XSD
        shell: bash
        run: python crates/export/tests/core_xsd_check.py ./synthetic-terrain.3mf | tee core-1.4-xsd-report.json
      - name: Correlate two independent reader reports with Rust-produced ZIP SHA
        shell: bash
        run: |
          python -c 'import json; a=json.load(open("independent-opc-report.json")); b=json.load(open("trimesh-import-report.json")); assert a["status"] == b["status"] == "passed"; assert a["packageSha256"] == b["packageSha256"]; assert a["vertices"] == b["vertices"] == 24; assert a["triangles"] == b["triangles"] == 44; assert a["aabbMm"] == b["aabbMm"] == [0,0,0,180,80,204]; assert a["volumeMm3"] == b["volumeMm3"] == 1449600; print("Two independent readers agree on the Rust-generated ZIP")'
      - name: Retain synthetic 3MF and validator evidence for lead slicer testing
        uses: actions/upload-artifact@v4
        with:
          name: a3-02-rust-3mf-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 30
          path: |
            synthetic-terrain.3mf
            rust-export-report.txt
            independent-opc-report.json
            trimesh-import-report.json
            core-1.4-xsd-report.json
