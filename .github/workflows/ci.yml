name: G0 foundation and contract checks

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install schema and compiler test tooling
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Validate TypeScript, schemas and fixtures
        run: npm run ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Rust unit tests
        run: cargo test --workspace
      - name: Check bounded native engine host health
        run: cargo run --quiet --bin map2model-engine -- --health
      - name: Run frozen synthetic-grid to real-mesh native CLI smoke
        run: cargo run --quiet --bin map2model-engine -- --smoke-mesh
