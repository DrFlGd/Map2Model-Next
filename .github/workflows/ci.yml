name: G0 foundation and contract checks

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install schema and compiler test tooling
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Validate TypeScript, schemas and fixtures
        run: npm run ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Rust unit tests
        run: cargo test --workspace
      - name: Check bounded native engine host health
        run: cargo run --quiet --bin map2model-engine -- --health
      - name: Run frozen synthetic-grid to real-mesh native CLI smoke
        run: cargo run --quiet --bin map2model-engine -- --smoke-mesh
      - name: Native synthetic grid to verified 3MF end-to-end smoke
        shell: bash
        run: |
          SAMPLE="$(node -p 'require("path").resolve("native-demo.3mf")')"
          cargo run --quiet --bin map2model-engine -- --export-synthetic "$SAMPLE" > native-3mf-report.json
          node -e 'const r=require("./native-3mf-report.json");if(r.status!=="ok"||r.result.synthetic!==true||r.result.threeMfExported!==true||r.result.vertices!==24||r.result.triangles!==44||r.result.productionGenerationReady!==false)process.exit(1)'
          python crates/export/tests/independent_3mf.py "$SAMPLE" crates/engine/fixtures/A3-01.reference.json
      - name: Generate original 512px PMTiles and verify native grid-to-3MF on both OSes
        shell: bash
        run: |
          mkdir -p target
          SOURCE="$(node -p 'require("path").resolve("target/ci-original-pmtiles")')"
          TARGET="$(node -p 'require("path").resolve("target/ci-original-terrain.3mf")')"
          cargo run --quiet -p map2model-data --bin terrain_synthetic_fixture -- "$SOURCE"
          cargo run --quiet --bin map2model-engine -- --export-original-pmtiles "$SOURCE" "$TARGET" > target/original-pmtiles-report.json
          python tests/verify_original_pmtiles_3mf.py "$TARGET" target/original-pmtiles-report.json
