name: Lead G2 one-time code formatter
on:
  push:
    branches:
      - agent/lead-G2-experimental-integration
    paths:
      - .github/workflows/lead-g2-format.yml
permissions:
  contents: write
jobs:
  rustfmt-on-lead-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.90.0'
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatting of lead integration modules
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/engine/src/experimental.rs crates/engine-cli/src/experimental_local.rs crates/engine-cli/src/main.rs crates/export/src/package.rs
          if ! git diff --cached --quiet; then
            git commit -m 'style(G2): format experimental source-to-3MF integration'
            git push origin HEAD:agent/lead-G2-experimental-integration
          fi
